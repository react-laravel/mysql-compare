[[permission]]
identifier = "allow-commands"
description = "Allow all MySQL Compare desktop commands"
commands.allow = [
  "connection_list",
  "connection_upsert",
  "connection_remove",
  "connection_close",
  "connection_set_database_credential",
  "connection_test_database_credential",
  "connection_test",
  "db_list_databases",
  "db_get_database_info",
  "db_list_tables",
  "db_query_rows",
  "db_insert_row",
  "db_update_row",
  "db_delete_rows",
  "db_execute_sql",
  "db_explain_sql",
  "db_rename_table",
  "db_copy_table",
  "db_drop_database",
  "db_drop_table",
  "db_truncate_table",
  "db_export_table",
  "db_export_database",
  "db_import_table",
  "schema_get_table",
  "ssh_list_files",
  "ssh_upload_file",
  "ssh_upload_directory",
  "ssh_upload_entries",
  "ssh_download_file",
  "ssh_download_directory",
  "ssh_read_file",
  "ssh_write_file",
  "ssh_create_directory",
  "ssh_delete_file",
  "ssh_move_file",
  "ssh_terminal_create",
  "ssh_terminal_write",
  "ssh_terminal_resize",
  "ssh_terminal_close",
  "diff_databases",
  "diff_table",
  "sync_build_plan",
  "sync_execute"
]
