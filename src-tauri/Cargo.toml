[package]
name = "mysql-compare"
version = "0.1.0"
description = "MySQL Compare desktop (Tauri + Rust)"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mysql_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
dirs = "6"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
ssh2 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
futures = "0.3"
thiserror = "2"
once_cell = "1"
regex = "1"
