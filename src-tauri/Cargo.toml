[package]
name = "mysql-compare"
version = "0.1.0"
description = "MySQL Compare desktop (Tauri + Rust)"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mysql_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
dirs = "6"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "postgres", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-rustls-comp", "connection-manager"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
futures = "0.3"
thiserror = "2"
once_cell = "1"
regex = "1"

[target.'cfg(not(windows))'.dependencies]
ssh2 = "0.9"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
