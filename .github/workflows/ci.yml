name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer
        run: npm run build:ui

  rust:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: contracts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: contract_test
          POSTGRES_DB: contracts
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U contract_test -d contracts"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev openssh-server
          sudo mkdir -p /run/sshd

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Database contracts
        env:
          MYSQL_COMPARE_MYSQL_TEST_PORT: 3306
          MYSQL_COMPARE_PG_TEST_PORT: 5432
          MYSQL_COMPARE_REDIS_TEST_PORT: 6379
        run: |
          # The browsing contracts exercise password failures. Keep the fixture
          # administrator trusted, but authenticate the two restricted accounts.
          docker exec "${{ job.services.postgres.id }}" sh -eu -c '
            hba="$PGDATA/pg_hba.conf"
            rules="$(mktemp)"
            printf "%s\n" "host all browse_user,browse_other_user all scram-sha-256" > "$rules"
            cat "$hba" >> "$rules"
            cat "$rules" > "$hba"
            rm "$rules"
          '
          docker exec "${{ job.services.postgres.id }}" psql -U contract_test -d contracts -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
          cargo test --manifest-path src-tauri/Cargo.toml --lib data_contract_tests -- --ignored
